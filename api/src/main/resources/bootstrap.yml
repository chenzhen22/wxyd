server:
  port: 8093
  servlet:
    context-path: /api

feign:
  client:
    config:
      default:
        connectTimeout: 180000
        readTimeout: 180000

spring:
  application:
    name: api
  servlet:
    multipart:
      max-file-size: 2000MB
      max-request-size: 2000MB
      enabled: true
  cloud:
    nacos:
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        file-extension: properties
        namespace: public