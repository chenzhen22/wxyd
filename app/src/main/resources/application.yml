server:
  port: ${PORT:8090}
  servlet:
    context-path: /api
  # 适配Railway反向代理，解决请求挂起pending
  forward-headers-strategy: NATIVE
  tomcat:
    remote-ip:
      enabled: true
    # 大文件/慢速上传：放宽连接空闲超时与断开后“吞咽”剩余请求体的上限，避免被 Tomcat 主动断流
    connection-timeout: 300000
    max-swallow-size: 2097152000

spring:
  application:
    name: wxyd
  mvc:
    pathmatch:
      # 接口接受 .do 后缀（前端统一 /xxx.do 请求）。
      # 注意：运行时为 Boot 2.7，默认 PathPatternParser 不支持后缀匹配，
      # 必须切回 ant_path_matcher 才能与 use-suffix-pattern 兼容，否则启动失败
      matching-strategy: ant_path_matcher
      use-suffix-pattern: true
  task:
    scheduling:
      pool-size: 2  # 雷达(每5分钟)与巡检日报(每小时整点)共用调度器，避免单线程互相饿死
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbc-url: ${datasource.url:jdbc:mysql://localhost:3306/wxyd?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${datasource.username:root}
    password: ${datasource.password:root}
    hikari:
      connection-timeout: 30000
      minimum-idle: 3
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 600000
      pool-name: WxydHikariCP
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 2000MB
      max-request-size: 2000MB
      enabled: true

mybatis:
  mapperLocations: classpath:mapper/*.xml

wxyd:
  mock:
    enabled: false
