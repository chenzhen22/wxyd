# common.properties — local replacement for the former Nacos "common" config.
# Mock mode (wxyd.mock.enabled=true) short-circuits tbphx.do, so most of these
# keys are only read on dormant paths (mail, login, ESB, TBP inner, uploadDoc
# whitelist). Values are dev placeholders; override per environment as needed.

# Console-log gate (WxydConsoleAppender): blank = always log (dev). Set to the
# designated server's host IP to restrict console output to one node.
localIp=

# Socket-message routing handle IP (dormant: unBindUkey/cfcaInfoQry/login)
handleIp=127.0.0.1

# /uploadDoc IP whitelist (comma-separated); blank denies all uploads
uploadDocIP=127.0.0.1

# Mail (dormant)
mailIp=127.0.0.1
mailUser=
mailPasswd=
mailSendUser=
mailRevUsers=
passworkKey=

# Transbank / ESB / TBP inner endpoints (dormant under mock)
transBankSIT1=127.0.0.1
transBankSIT2=127.0.0.1
transBankUAT1=127.0.0.1
transBankUAT2=127.0.0.1
transBankDEV=127.0.0.1
ESBSIT1=127.0.0.1
ESBSIT2=127.0.0.1
ESBUAT1=127.0.0.1
ESBUAT2=127.0.0.1
ESBDEV=127.0.0.1
TBPSIT1=127.0.0.1
TBPSIT2=127.0.0.1
TBPUAT1=127.0.0.1
TBPUAT2=127.0.0.1
TBPDEV=127.0.0.1
