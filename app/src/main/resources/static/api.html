<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <title>小泽助手</title>
    <!-- 引入jQuery -->
    <script src="Assets/js/jquery-1.8.3.min.js" type="text/javascript"></script>
    <script src="Assets/js/index.js" type="text/javascript"></script>
    <link href="Assets/css/admin.css" rel="stylesheet" type="text/css">
</head>
<body>
<header class="top-header">
    <div class="top-logo">小泽助手</div>
    <div class="top-user">
        <span id="userName" style="padding-right: 30px;"></span>
    </div>
</header>

<div class="modal" id="loading">
    <div class="modal-content">
        <div class="modal-title">提示</div>
        <div class="form-item"><span>加载中，请稍后...</span></div>
    </div>
</div>

<div class="modal" id="alterModal">
    <div class="modal-content">
        <div class="modal-title">提示<span class="close-modal" id="close-alterModal">×</span></div>
        <div class="form-item"><span id="alterSpan"></span></div>
        <div class="modal-btn-group">
            <button class="btn-primary" id="confirm-modal">确认</button>
        </div>
    </div>
</div>

<div class="modal" id="userModal">
    <div class="modal-content">
        <div class="modal-title">新增白名单 <span class="close-modal">×</span></div>
        <div class="form-item"><label>用户名：</label><input id="addUserName" type="text"></div>
        <div class="modal-btn-group">
            <button class="btn-cancel close-modal">取消</button>
            <button class="btn-primary" id="confirmAddUser">确定新增</button>
        </div>
    </div>
</div>

<div class="modal" id="msgModal">
    <div class="modal-content">
        <div class="modal-title">新增留言 <span class="close-modal">×</span></div>
        <div class="form-item"><label>留言内容：</label><input id="addMsgContent" type="text"></div>
        <div class="modal-btn-group">
            <button class="btn-cancel close-modal">取消</button>
            <button class="btn-primary" id="confirmAddMsg">提交留言</button>
        </div>
    </div>
</div>

<div class="wrap-container">
    <aside class="left-sidebar">
        <ul class="menu-list">
            <li class="menu-item active" data-target="welcome"><i>🏠</i>首页</li>
            <li class="menu-item" data-target="userManage"><i>👤</i>用户管理</li>
            <li class="menu-item" data-target="noPwdLogin"><i>🔑</i>免密登录</li>
            <li class="menu-item" data-target="messageBoard"><i>💬</i>留言板</li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="module-box active" id="welcome">
            <div class="welcome-home">
                <div class="grid-layer"></div>
                <div class="welcome-content">
                    <h2>欢迎进入小泽助手</h2>
                    <p>云端运维 · 安全管控 · 高效协同管理平台</p>
                    <div class="welcome-time" id="nowTime"></div>
                </div>
            </div>
        </div>

        <div class="module-box" id="userManage">
            <div class="page-title">用户管理 / 白名单配置</div>
            <div class="tool-bar">
                <button class="btn-primary" id="openAddUser">新增白名单</button>
                <div class="search-group">
                    <input id="userSearchInp" placeholder="输入用户名搜索" type="text">
                    <button class="btn-search" id="userSearch">搜索</button>
                </div>
            </div>
            <table class="data-table">
                <thead>
                <tr>
                    <th>序号</th>
                    <th>用户名</th>
                    <th>ip</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
            <div class="pag-box" id="userPag"></div>
        </div>

        <div class="module-box" id="noPwdLogin">
            <div class="page-title">免密登录服务</div>
            <div class="cert-card">
                <div class="cert-card-tit">网银登录</div>
                <div class="cert-form-row">
                    <div class="cert-form-item">
                        <label>用户名：</label>
                        <input id="userName1" placeholder="请输入用户名" type="text">
                    </div>
                    <div class="cert-form-item">
                        <label>选择环境：</label>
                        <select id="Ostype1">
                            <option value="">请选择环境</option>
                            <option value="0">SIT1</option>
                            <option value="1">SIT2</option>
                            <option value="2">UAT1</option>
                            <option value="3">UAT2</option>
                            <option value="4">DEV</option>
                        </select>
                    </div>
                </div>
                <div class="cert-btn-group">
                    <button class="btn-main" id="loginWy" onclick="loginWy()">登录</button>
                </div>
            </div>
            <div class="cert-card">
                <div class="cert-card-tit">内管登录</div>
                <div class="cert-form-row">
                    <div class="cert-form-item">
                        <label>用户名：</label>
                        <input id="userName2" placeholder="请输入用户名" type="text" value="00150366">
                    </div>
                    <div class="cert-form-item">
                        <label>选择环境：</label>
                        <select id="Ostype2" onchange="NGLoginChange();">
                            <option value="">请选择环境</option>
                            <option value="0">SIT1</option>
                            <option value="1">SIT2</option>
                            <option value="2">UAT1</option>
                            <option value="3">UAT2</option>
                            <option value="4">DEV</option>
                            <option value="5">本地</option>
                        </select>
                    </div>
                    <div class="cert-form-item" id="nglocalType" style="display: none;">
                        <label>本地环境：</label>
                        <select id="lstype">
                            <option value="0">SIT1</option>
                            <option value="1">SIT2</option>
                            <option value="2">UAT1</option>
                            <option value="3">UAT2</option>
                        </select>
                    </div>
                </div>
                <div class="cert-btn-group">
                    <button class="btn-main" id="ngLogin" onclick="NGLogin()">登录</button>
                </div>
            </div>
        </div>

        <div class="module-box" id="messageBoard">
            <div class="page-title">留言板管理</div>
            <div style="margin-bottom: 20px;">
                <button class="btn-main" id="openAddMsg">新增留言</button>
                <button class="btn-main" id="lookMsgByAll">看全部</button>
                <button class="btn-main" id="lookMsgByMe">只看我的</button>
            </div>
            <table class="data-table">
                <thead>
                <tr>
                    <th width="10%">序号</th>
                    <th width="15%">昵称</th>
                    <th width="50%">留言内容</th>
                    <th width="15%">留言时间</th>
                    <th width="10%">操作</th>
                </tr>
                </thead>
                <tbody id="msgTableBody"></tbody>
            </table>
            <div class="pag-box" id="msgPag"></div>
        </div>

    </main>
</div>
</body>
</html>
