<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>金融日报</title>
    <link href="Assets/css/admin.css?v=20261009" rel="stylesheet" type="text/css">
    <!-- 进入页面前先套用已保存主题，避免闪烁 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem("wxyd-theme");
                if (t === "system") {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? "dark" : "light";
                }
                if (t) document.documentElement.setAttribute("data-theme", t);
                else document.documentElement.setAttribute("data-theme", "dark");
            } catch (e) {}
        })();
    </script>
    <style>
        body { margin: 0; min-height: 100vh; }
        .share-wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
        .share-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .share-logo { font-weight: 700; color: var(--title); font-size: 16px; }
        .share-back { font-size: 13px; color: var(--accent); text-decoration: none; cursor: pointer; }
        .share-cta {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 18px; margin-bottom: 18px; border-radius: 14px;
            background: var(--glass-2); border: 1px solid var(--glass-5);
        }
        .share-cta .tit { font-weight: 600; color: var(--title); font-size: 14px; }
        .share-cta .sub { font-size: 12px; color: var(--text-5); margin-top: 3px; }
        .share-cta .btn {
            white-space: nowrap; font-size: 13px; padding: 8px 18px; border-radius: 10px;
            background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
        }
        .share-cta .btn.ghost { background: var(--glass-3); color: var(--text-1); font-weight: 400; margin-left: 8px; }
        @media (max-width: 560px) { .share-cta { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
<div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div>
<div class="share-wrap">
    <div class="share-head">
        <span class="share-logo">📈 金融日报</span>
    </div>
    <div class="share-cta">
        <div>
            <div class="tit">📡 每天自动收到这份日报</div>
            <div class="sub">注册小泽助手账号，新日报自动推送到你的钉钉或邮箱</div>
        </div>
        <div>
            <a class="btn" id="ctaRegister" href="register.html">立即注册</a>
            <a class="btn ghost" href="login.html">已有账号</a>
        </div>
    </div>
    <div class="welfare-article" id="shareArticle"><div class="welfare-empty">加载中…</div></div>
    <div class="share-cta" style="margin-top:22px;">
        <div>
            <div class="tit">觉得这份日报有用？</div>
            <div class="sub">注册后可订阅推送，每天准时送达，不用惦记着来看</div>
        </div>
        <div><a class="btn" href="register.html">免费注册</a></div>
    </div>
</div>
<script src="Assets/js/jquery-3.7.1.min.js" type="text/javascript"></script>
<script src="Assets/js/welfare-md.js?v=2" type="text/javascript"></script>
<script>
    (function () {
        var qs = new URLSearchParams(location.search);
        var id = qs.get('id');
        var token = qs.get('t'); // 访问令牌，防 id 枚举，缺失或不匹配按不存在处理
        function esc(s) {
            return s == null ? '' : String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        if (!id) {
            $('#shareArticle').html('<div class="welfare-empty">缺少日报 id，链接无效</div>');
            return;
        }
        $.getJSON('wdayinfo/detail', { id: id, t: token || '' }).done(function (res) {
            if (res.errorCode !== '000000' || !res.body) {
                $('#shareArticle').html('<div class="welfare-empty">' + esc(res.errorMsg || '加载失败') + '</div>');
                return;
            }
            var d = res.body;
            document.title = d.title || '金融日报';
            $('#shareArticle').html(
                '<h1 class="wf-title">' + esc(d.title) + '</h1>' +
                '<div class="wf-meta">' + esc(d.infoDate || '') + '</div>' +
                '<div class="wf-body">' + window.WelfareMd.render(d.content) + '</div>');
        }).fail(function () {
            $('#shareArticle').html('<div class="welfare-empty">加载失败，请稍后重试</div>');
        });
    })();
</script>
</body>
</html>
