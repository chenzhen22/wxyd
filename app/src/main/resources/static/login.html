<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>登录 — 小泽助手</title>
    <script>
        /* 手机浏览器访问桌面版登录页时，自动跳转到 H5 页（?pc=1 可强制停留桌面版） */
        (function () {
            var ua = navigator.userAgent;
            var mobile = /android|iphone|ipod|ipad|windows phone|mobile/i.test(ua)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (mobile && !new URLSearchParams(location.search).has("pc")) {
                location.replace("h5.html");
            }
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            /* 全屏背景图（南宫婉 4K 壁纸） */
            background: #15131f url("Assets/img/login-bg.jpg") center/cover no-repeat fixed;
        }
        /* 背景压暗层：保证卡片与文字在亮色壁纸上依然清晰 */
        .bg-overlay {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(125% 110% at 50% 0%, rgba(15,12,41,.30), rgba(15,12,41,.78)),
                linear-gradient(160deg, rgba(48,43,99,.50), rgba(36,36,62,.62));
        }

        /* 玻璃卡片 */
        .login-card {
            position: relative; z-index: 1;
            width: 400px; padding: 48px 40px 40px;
            color: #f1f1f4;
            background: rgba(20,16,40,.45);
            backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255,255,255,.28);
            border-radius: 24px;
            box-shadow: 0 12px 48px rgba(0,0,0,.55);
            animation: cardIn .7s cubic-bezier(.16,1,.3,1);
        }
        @keyframes cardIn { from{ opacity:0; transform: translateY(40px) scale(.96); } to{ opacity:1; transform: translateY(0) scale(1); } }

        .login-card h2 {
            text-align: center; margin-bottom: 8px; font-size: 28px; font-weight: 700;
            background: linear-gradient(90deg, #c4b5fd, #f5b8e6, #8fd3ff);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,.55));
        }
        .login-card .subtitle {
            text-align: center; color: rgba(255,255,255,.85); font-size: 13px; margin-bottom: 36px;
            text-shadow: 0 1px 6px rgba(0,0,0,.7);
        }

        .input-group { margin-bottom: 22px; position: relative; }
        .input-group input {
            width: 100%; padding: 14px 16px 14px 46px;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.30);
            border-radius: 12px; color: #fff; font-size: 15px; outline: none;
            transition: border-color .3s, box-shadow .3s, background .3s;
        }
        .input-group input::placeholder { color: rgba(255,255,255,.65); }
        .input-group input:focus {
            border-color: #c4b5fd;
            box-shadow: 0 0 0 3px rgba(196,181,253,.35);
            background: rgba(255,255,255,.2);
        }
        .input-group .icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            width: 20px; height: 20px; opacity: .8;
        }

        .btn-login {
            width: 100%; padding: 14px; margin-top: 4px;
            border: none; border-radius: 12px; cursor: pointer;
            font-size: 16px; font-weight: 600; color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: transform .2s, box-shadow .2s, opacity .2s;
            box-shadow: 0 4px 20px rgba(118,75,162,.4);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(118,75,162,.55); }
        .btn-login:active { transform: translateY(0); opacity: .9; }

        .tip { color: #f87171; font-size: 13px; text-align: center; margin-top: 16px; min-height: 18px; }

        .register-link { text-align: center; margin-top: 24px; font-size: 14px; color: rgba(255,255,255,.9); text-shadow: 0 1px 6px rgba(0,0,0,.7); }
        .register-link a { color: #c4b5fd; text-decoration: none; transition: color .2s; }
        .register-link a:hover { color: #f5b8e6; }

        .oauth-sep { display: flex; align-items: center; text-align: center; color: rgba(255,255,255,.55); margin: 18px 0 10px; font-size: 13px; }
        .oauth-sep::before, .oauth-sep::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.18); }
        .oauth-sep span { padding: 0 12px; }

        .btn-github {
            display: block; width: 100%; box-sizing: border-box; padding: 13px;
            text-align: center; text-decoration: none; cursor: pointer;
            border-radius: 12px; font-size: 15px; font-weight: 600; color: #fff;
            background: #24292f; border: 1px solid rgba(255,255,255,.12);
            transition: background .2s, transform .2s;
        }
        .btn-github:hover { background: #32383f; transform: translateY(-1px); }

        /* 登录 / 授权过程浮层 */
        .login-overlay { position: fixed; inset: 0; z-index: 999; display: none;
            align-items: center; justify-content: center;
            background: rgba(10,8,24,.55);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .login-overlay.show { display: flex; }
        .login-overlay .box { display: flex; flex-direction: column; align-items: center; gap: 16px;
            padding: 34px 46px; border-radius: 18px; color: #f1f1f4; font-size: 14px; letter-spacing: 1px;
            background: rgba(20,16,40,.78); border: 1px solid rgba(255,255,255,.22);
            box-shadow: 0 12px 48px rgba(0,0,0,.5); }
        .login-overlay .spin { width: 34px; height: 34px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,.18); border-top-color: #a78bfa;
            animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>

    <div class="login-card">
        <h2>欢迎回来</h2>
        <p class="subtitle">小泽助手 · 请登录以继续</p>

        <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
                <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>
            </svg>
            <input id="loginUser" type="text" placeholder="用户名 / 邮箱">
        </div>
        <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
                <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input id="loginPwd" type="password" placeholder="密码">
        </div>

        <button class="btn-login" onclick="doLogin()">登 录</button>

        <div class="oauth-sep"><span>或</span></div>
        <a class="btn-github" href="/api/oauth/github?redirect=/api/api.html" onclick="showLoginOverlay('正在跳转 GitHub 授权…')">使用 GitHub 登录</a>

        <div class="tip" id="loginTip"></div>

        <div class="register-link">还没有账号？ <a href="register.html">注册新用户</a></div>
    </div>

    <div class="login-overlay" id="loginOverlay">
        <div class="box"><div class="spin"></div><div id="loginOverlayText">正在登录…</div></div>
    </div>

<script src="Assets/js/jquery-3.7.1.min.js" type="text/javascript"></script>
<script>
function showLoginOverlay(text) {
    $("#loginOverlayText").text(text || "正在登录…");
    $("#loginOverlay").addClass("show");
}
/* 从 GitHub 授权页返回（bfcache 恢复）时确保浮层关闭 */
window.addEventListener("pageshow", function (e) { if (e.persisted) $("#loginOverlay").removeClass("show"); });
(function () {
    var p = new URLSearchParams(location.search).get("oauth");
    if (p === "error") $("#loginTip").text("GitHub 授权登录失败，请重试或使用密码登录");
    else if (p === "neterror") $("#loginTip").text("无法连接 GitHub：服务器出网被拦截或未配置代理，请联系管理员");
    else if (p === "disabled") $("#loginTip").text("GitHub 登录未配置，请使用密码登录");
})();
function doLogin(){
    var u=$("#loginUser").val(),p=$("#loginPwd").val();
    if(!u||!p){$("#loginTip").text("请输入用户名/邮箱和密码");return;}
    showLoginOverlay("正在登录…");
    $(".btn-login").attr("disabled",true).text("登录中…");
    $.ajax({url:"login",type:"post",contentType:"application/json",
        data:JSON.stringify({body:{username:u,password:p}}),
        success:function(data){
            $(".btn-login").attr("disabled",false).text("登 录");
            if(data.errorCode=="000000"){location.href="api.html";}
            else{$("#loginOverlay").removeClass("show");$("#loginTip").text(data.errorMsg);}
        },error:function(){
            $(".btn-login").attr("disabled",false).text("登 录");
            $("#loginOverlay").removeClass("show");
            $("#loginTip").text("网络异常");
        }});
}
/* 回车提交 */
$(document).keydown(function(e){ if(e.which==13) doLogin(); });
</script>
</body>
</html>
