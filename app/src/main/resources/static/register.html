<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <title>注册 — 小泽助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%; animation: bgShift 15s ease infinite;
        }
        @keyframes bgShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .55; z-index: 0; }
        .blob1 { width:520px;height:520px; background:linear-gradient(135deg,#667eea,#764ba2); top:-160px;left:-120px; animation:float1 9s ease-in-out infinite; }
        .blob2 { width:460px;height:460px; background:linear-gradient(135deg,#4facfe,#00f2fe); bottom:-140px;right:-100px; animation:float2 11s ease-in-out infinite; }
        .blob3 { width:380px;height:380px; background:linear-gradient(135deg,#f093fb,#f5576c); top:40%;left:55%; animation:float3 13s ease-in-out infinite; }
        @keyframes float1 {0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(120px,90px) scale(1.15)}}
        @keyframes float2 {0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-100px,-70px) scale(1.1)}}
        @keyframes float3 {0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-30%,-65%) scale(1.2)}}

        .login-card {
            position: relative; z-index: 1; width: 400px; padding: 44px 40px 36px;
            background: rgba(255,255,255,.08); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,.18); border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,.35); animation: cardIn .7s cubic-bezier(.16,1,.3,1);
        }
        @keyframes cardIn { from{opacity:0;transform:translateY(40px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }
        .login-card h2 {
            text-align:center; margin-bottom:8px; font-size:28px; font-weight:700;
            background:linear-gradient(90deg,#4facfe,#a78bfa,#f093fb);
            -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
        }
        .login-card .subtitle { text-align:center; color:rgba(255,255,255,.5); font-size:13px; margin-bottom:32px; }

        .input-group { margin-bottom:20px; position:relative; }
        .input-group input {
            width:100%; padding:14px 16px 14px 46px;
            background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15);
            border-radius:12px; color:#fff; font-size:15px; outline:none;
            transition:border-color .3s,box-shadow .3s,background .3s;
        }
        .input-group input::placeholder { color:rgba(255,255,255,.4); }
        .input-group input:focus { border-color:#4facfe; box-shadow:0 0 0 3px rgba(79,172,254,.25); background:rgba(255,255,255,.1); }
        .input-group .icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; opacity:.6; }

        .btn-login {
            width:100%; padding:14px; margin-top:4px; border:none; border-radius:12px; cursor:pointer;
            font-size:16px; font-weight:600; color:#fff;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            transition:transform .2s,box-shadow .2s,opacity .2s; box-shadow:0 4px 20px rgba(79,172,254,.4);
        }
        .btn-login:hover { transform:translateY(-2px); box-shadow:0 6px 28px rgba(79,172,254,.55); }
        .btn-login:active { transform:translateY(0); opacity:.9; }
        .tip { color:#34d399; font-size:13px; text-align:center; margin-top:16px; min-height:18px; }
        .login-link { text-align:center; margin-top:22px; font-size:14px; }
        .login-link a { color:#4facfe; text-decoration:none; transition:color .2s; }
        .login-link a:hover { color:#a78bfa; }
    </style>
</head>
<body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <div class="login-card">
        <h2>创建账号</h2>
        <p class="subtitle">小泽助手 · 注册后需管理员审批</p>

        <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
            <input id="rUser" type="text" placeholder="用户名">
        </div>
        <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="rPwd" type="password" placeholder="密码">
        </div>
        <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9"/><path d="M9 11l3 3 7-7"/></svg>
            <input id="rName" type="text" placeholder="显示名（选填）">
        </div>

        <button class="btn-login" onclick="doRegister()">提交注册</button>
        <div class="tip" id="rTip"></div>

        <div class="login-link">已有账号？ <a href="login.html">返回登录</a></div>
    </div>

<script src="Assets/js/jquery-1.8.3.min.js" type="text/javascript"></script>
<script>
function doRegister(){
    var u=$("#rUser").val(),p=$("#rPwd").val(),n=$("#rName").val();
    if(!u||!p){$("#rTip").text("用户名和密码必填");return;}
    $(".btn-login").attr("disabled",true).text("提交中…");
    $.ajax({url:"register",type:"post",contentType:"application/json",
        data:JSON.stringify({body:{username:u,password:p,displayName:n}}),
        success:function(data){
            $(".btn-login").attr("disabled",false).text("提交注册");
            if(data.errorCode=="000000"){$("#rTip").text("注册成功，等待管理员审批");}
            else{$("#rTip").text(data.errorMsg);}
        },error:function(){
            $(".btn-login").attr("disabled",false).text("提交注册");
            $("#rTip").text("网络异常");
        }});
}
$(document).keydown(function(e){ if(e.which==13) doRegister(); });
</script>
</body>
</html>
