# Test datasource config — use H2 in-memory
spring.cloud.nacos.discovery.server-addr=localhost:8848
spring.cloud.nacos.config.enabled=false

datasource.url=jdbc:h2:mem:batch;DB_CLOSE_DELAY=-1;MODE=MySQL
datasource.username=sa
datasource.password=

# CFCA socket config (placeholder values for test)
cfca.socketServerIP=127.0.0.1
cfca.socketServerPort=0
cfca.connectTimeout=2000
cfca.readTimeout=4000
