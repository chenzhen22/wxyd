# Test datasource config — use H2 in-memory databases
spring.cloud.nacos.discovery.server-addr=localhost:8848
spring.cloud.nacos.config.enabled=false

# MySQL
spring.datasource.mysql.driver-class-name=org.h2.Driver
spring.datasource.mysql.jdbc-url=jdbc:h2:mem:mysql;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.mysql.username=sa
spring.datasource.mysql.password=

# first (Oracle -> H2)
spring.datasource.first.driver-class-name=org.h2.Driver
spring.datasource.first.jdbc-url=jdbc:h2:mem:first;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.first.username=sa
spring.datasource.first.password=

